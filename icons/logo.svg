<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle Border Gradient (Blue to Teal) -->
    <linearGradient id="ykBorderGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Card Background (Soft Clean Pure Tone) -->
    <linearGradient id="ykBgGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- YK Text Gradient (Deep Royal to Vibrant Blue) -->
    <linearGradient id="ykTextGrad" x1="20" y1="20" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Soft Blur Filter for Laboratory Beaker -->
    <filter id="ykBeakerBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 1. Squircle Shape (모서리가 둥근 사각형) -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ykBgGrad)" stroke="url(#ykBorderGrad)" stroke-width="5.5"/>

  <!-- 2. Background Laboratory Beaker (흐리게 들어간 실험실 비커) -->
  <g filter="url(#ykBeakerBlur)" opacity="0.26">
    <!-- Beaker Body Outline & Soft Sky Tint -->
    <path d="M43 18 H57 V28 L72 61 C76 69 70 78 61 78 H39 C30 78 24 69 28 61 L43 28 V18 Z" 
          fill="#BAE6FD" stroke="#0284C7" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Liquid Surface Wave & Fill -->
    <path d="M32 60 C37 57 47 63 53 59 C58 56 63 58 68 60 L62 74 C60 76 57 76 50 76 C43 76 40 76 38 74 Z" 
          fill="#2DD4BF"/>
    <!-- Chemical Bubbles -->
    <circle cx="48" cy="45" r="3" fill="#0284C7"/>
    <circle cx="56" cy="38" r="2" fill="#0D9488"/>
    <!-- Graduations -->
    <line x1="39" y1="46" x2="45" y2="46" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="54" x2="44" y2="54" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 3. Foreground Typography (Pretendard 기반 YK & app) -->
  <!-- 'YK' Bold Text -->
  <text x="50" y="52" text-anchor="middle" 
        font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="34" fill="url(#ykTextGrad)" letter-spacing="-1">YK</text>

  <!-- 'app' Subtitle Text -->
  <text x="50" y="73" text-anchor="middle" 
        font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" font-size="16.5" fill="#0D9488" letter-spacing="1.2">app</text>
</svg>